<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Anomaly Detection Pipeline — Demo</title>
  <style>
    body{font-family:'Times New Roman', Times, serif;padding:2rem;color:#35261d;background:#fffefc}
    .card{max-width:840px;margin:2rem auto;padding:1.6rem;border:1px solid rgba(53,38,29,0.06);border-radius:12px}
    h1{color:#6b3e26}
    canvas{width:100%;height:160px}
    .back{display:inline-block;margin-top:1rem;color:#6b3e26;text-decoration:none;border:1px solid rgba(107,62,38,0.08);padding:8px 12px;border-radius:8px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Anomaly Detection Pipeline — Demo</h1>
    <p>Small demo visualizing a sample metric and marking detected anomalies (mock data).</p>
    <canvas id="chart"></canvas>
    <a class="back" href="/">← Back to portfolio</a>
  </div>
<script>
  const c=document.getElementById('chart'); const ctx=c.getContext('2d'); const w=c.clientWidth; const h=160; c.width=w; c.height=h;
  const vals=[10,12,11,13,12,40,13,12,11,9,8,30,9,10];
  const max=Math.max(...vals), min=Math.min(...vals), pad=12; ctx.beginPath(); ctx.strokeStyle='#4b6cb7'; ctx.lineWidth=2; vals.forEach((v,i)=>{ const x=pad + i*( (w-pad*2)/(vals.length-1) ); const y=h-pad - ((v-min)/(max-min))*(h-pad*2); if(i===0)ctx.moveTo(x,y); else ctx.lineTo(x,y); }); ctx.stroke();
  // mark anomalies (>25)
  ctx.fillStyle='#c58f2e'; vals.forEach((v,i)=>{ if(v>25){ const x=pad + i*( (w-pad*2)/(vals.length-1) ); const y=h-pad - ((v-min)/(max-min))*(h-pad*2); ctx.beginPath(); ctx.arc(x,y,5,0,Math.PI*2); ctx.fill(); }});
</script>
</body>
</html>
